spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:ecommercedb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:zOl5YhE6jj0THM2FoARQNIPxM9QC7dgmEWkX7XmiCjobnOArItkZX9leKAYDRykm-CHANGE-ME-IN-PRODUCTION}
    access-token-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

payment:
  gateway: ${PAYMENT_GATEWAY:mock}

stripe:
  api:
    key: ${STRIPE_API_KEY:}

logging:
  level:
    com.ecommerce: INFO
