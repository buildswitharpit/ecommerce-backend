spring:
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: "test-only-secret-key-do-not-use-in-production-must-be-at-least-32-bytes-long"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

payment:
  gateway: mock

logging:
  level:
    com.ecommerce: INFO
