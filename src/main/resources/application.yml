spring:
  application:
    name: ecommerce-backend

  # Default local profile: in-memory H2, no external DB setup required.
  datasource:
    url: jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # HS256 signing secret. This default is fine for local dev/portfolio demo purposes
    # only -- it is committed to source control, so it MUST be overridden (env var
    # APP_JWT_SECRET) with a freshly generated, secret value for any real deployment.
    # Needs to be at least 256 bits (32 bytes) once UTF-8 encoded; this one is 64 bytes.
    secret: "zOl5YhE6jj0THM2FoARQNIPxM9QC7dgmEWkX7XmiCjobnOArItkZX9leKAYDRykm-CHANGE-ME-IN-PRODUCTION"
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

payment:
  # "mock" (default) or "stripe". See PaymentGateway / MockPaymentGateway /
  # StripePaymentGateway and the README for how switching this works.
  gateway: mock

stripe:
  # Only read when payment.gateway=stripe. A real Stripe test-mode secret key, e.g.
  # sk_test_... Leave unset while payment.gateway=mock (the default).
  api:
    key: ""

logging:
  level:
    com.ecommerce: INFO
